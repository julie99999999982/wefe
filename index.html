<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALCU 2025 Sports Games | Julie A. Bayoyos</title>

    <!-- Fonts and Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              poppins: ['Poppins', 'sans-serif'],
            },
            boxShadow: {
              '3d': '10px 10px 30px rgba(0,0,0,0.2), -5px -5px 15px rgba(255,255,255,0.6)',
            },
            animation: {
              float: 'float 5s ease-in-out infinite',
              fadeIn: 'fadeIn 2s ease',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
          },
        },
      };
    </script>

    <!-- AOS for entrance animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body class="bg-white text-gray-800 font-poppins overflow-hidden">

    <!-- Loading Animation -->
    <div id="preloader" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-red-500 border-dashed rounded-full animate-spin"></div>
    </div>

   <!-- Header -->
<header class="bg-red-600 text-white py-4 shadow-lg fixed w-full z-30 animate-fadeIn">
  <nav class="flex justify-between items-center max-w-7xl mx-auto px-6">
    <!-- Logo and title -->
    <div class="flex items-center gap-3">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRO4jeyrtApRw6SIX9WR5342CsRMDX4ZiMRLg&s"
        alt="Logo"
        class="h-12 w-12 rounded-full shadow-md hover:scale-110 transition-transform duration-300" />
      <h1 class="text-2xl md:text-3xl font-extrabold hover:text-yellow-300 transition duration-300">ALCU 2025</h1>
    </div>

    <!-- Desktop nav -->
    <div class="hidden md:flex gap-10 text-base font-semibold">
      <a href="index.html" class="hover:text-yellow-300 transition duration-300 relative group">
        Home
        <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-300 transition-all group-hover:w-full"></span>
      </a>
      <a href="about.html" class="hover:text-yellow-300 transition duration-300 relative group">
        About
        <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-300 transition-all group-hover:w-full"></span>
      </a>
      <a href="galary.html" class="hover:text-yellow-300 transition duration-300 relative group">
        Gallery
        <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-300 transition-all group-hover:w-full"></span>
      </a>
    </div>

    <!-- Mobile hamburger -->
    <div class="md:hidden">
      <button id="menu-btn" class="focus:outline-none">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16">
          </path>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu"
    class="md:hidden hidden px-6 pb-4 pt-2 flex flex-col gap-4 bg-red-700 text-white text-base font-semibold transition-all duration-300">
    <a href="index.html" class="hover:text-yellow-300">Home</a>
    <a href="about.html" class="hover:text-yellow-300">About</a>
    <a href="galary.html" class="hover:text-yellow-300">Gallery</a>
  </div>
</header>

<!-- Toggle Script -->
<script>
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  menuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
  });
</script>

























  <!-- Hero Section -->
<section id="home" class="h-screen pt-32 px-6 bg-white relative flex items-center justify-center z-10">
  <!-- Particle Background -->
  <div id="particles-js" class="absolute top-0 left-0 w-full h-full -z-10"></div>

  <div class="max-w-7xl w-full mx-auto flex flex-col md:flex-row items-center justify-between gap-16">
    
    <!-- Left Text Content -->
    <div class="w-full md:w-1/2 space-y-6 text-center md:text-left" data-aos="fade-up">
      <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 leading-tight drop-shadow-md">
        Welcome to <span class="text-red-600 drop-shadow-lg">ALCU 2025 Sports</span>
      </h1>
      <p class="text-lg text-gray-700 max-w-md md:max-w-full mx-auto md:mx-0 leading-relaxed">
        A celebration of <span class="text-red-500 font-semibold">passion</span>, 
        <span class="text-red-500 font-semibold">teamwork</span>, and 
        <span class="text-red-500 font-semibold">excellence</span> across universities. 
        Feel the heat, the cheers, the unforgettable moments!
      </p>
      <a href="galary.html"
         class="inline-block px-8 py-4 rounded-full bg-red-600 text-white font-bold shadow-2xl hover:bg-red-700 hover:scale-105 transition-transform duration-300">
        🎯 Explore the Action
      </a>
    </div>

    <!-- Right Image (Enhanced 3D & Animation) -->
    <div class="w-full md:w-1/2 flex justify-center" data-aos="zoom-in">
      <div class="relative w-[26rem] h-[26rem] rounded-[2rem] overflow-hidden bg-white/40 backdrop-blur-xl shadow-[20px_20px_60px_rgba(0,0,0,0.2),-10px_-10px_30px_rgba(255,255,255,0.6)] transform transition-transform duration-500 hover:scale-105 hover:rotate-1 animate-float">
        <img src="https://m.media-amazon.com/images/I/71h-g2uxm-L._AC_UF1000,1000_QL80_.jpg"
             class="w-full h-full object-cover"
             alt="Event Image" />
        <!-- Optional inner glow or highlight -->
        <div class="absolute inset-0 bg-white/10 pointer-events-none rounded-[2rem]"></div>
      </div>
    </div>
  </div>
</section>

















    <!-- Scripts -->
    <script>
      window.addEventListener('load', () => {
        document.getElementById('preloader').style.display = 'none';
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <script>
      particlesJS("particles-js", {
        particles: {
          number: { value: 50 },
          size: { value: 2.5 },
          move: { enable: true, speed: 1.2 },
          line_linked: { enable: true, distance: 130, color: "#ff4d4d" },
        },
      });
    </script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>

  </body>
</html>
